name: Build All Platforms

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      platforms:
        description: '选择要构建的平台（多选用逗号分隔）'
        required: false
        default: 'android,ios,macos,linux,windows'
        type: string
      flutter_version:
        description: 'Flutter 版本（留空使用默认 3.35.6）'
        required: false
        default: ''
        type: string

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.35.6' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_number: ${{ steps.version.outputs.version_number }}
      build_type: ${{ steps.version.outputs.build_type }}
      build_tag: ${{ steps.version.outputs.build_tag }}
      build_datetime: ${{ steps.version.outputs.build_datetime }}
      build_timezone: ${{ steps.version.outputs.build_timezone }}
      dart_defines: ${{ steps.version.outputs.dart_defines }}
      selected_platforms: ${{ steps.platforms.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine Platforms
        id: platforms
        run: |
          # 使用 inputs.platforms（手动触发）或默认全平台（push 触发）
          PLATFORMS="${{ inputs.platforms || 'android,ios,macos,linux,windows' }}"
          echo "selected=$PLATFORMS" >> $GITHUB_OUTPUT
          echo "Selected platforms: $PLATFORMS"

      - name: Generate Version
        id: version
        run: |
          chmod +x scripts/generate_version.sh
          source <(sed 's/^echo /export /g' scripts/generate_version.sh)

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "build_datetime=$BUILD_DATETIME" >> $GITHUB_OUTPUT
          echo "build_timezone=$BUILD_TIMEZONE" >> $GITHUB_OUTPUT

          DART_DEFINES="--dart-define=VERSION_NAME=$VERSION_NAME"
          DART_DEFINES="$DART_DEFINES --dart-define=VERSION_TYPE=$BUILD_TYPE"
          DART_DEFINES="$DART_DEFINES --dart-define=VERSION_TAG=$BUILD_TAG"
          DART_DEFINES="$DART_DEFINES --dart-define=VERSION_DATETIME=$BUILD_DATETIME"
          DART_DEFINES="$DART_DEFINES --dart-define=VERSION_TIMEZONE=$BUILD_TIMEZONE"

          echo "$DART_DEFINES" > /tmp/dart_defines.txt
          echo "dart_defines<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/dart_defines.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Print Version Info
        run: |
          echo "==============================="
          echo "  Version:       ${{ steps.version.outputs.version_name }}"
          echo "  Build Number:  ${{ steps.version.outputs.version_number }}"
          echo "  Build Type:    ${{ steps.version.outputs.build_type }}"
          echo "  Tag:           ${{ steps.version.outputs.build_tag || 'None (auto-generated)' }}"
          echo "  DateTime:      ${{ steps.version.outputs.build_datetime || 'N/A' }}"
          echo "  Timezone:      ${{ steps.version.outputs.build_timezone || 'N/A' }}"
          echo "  Commit:        ${{ github.sha }}"
          echo "==============================="

  # ==================== Android ====================
  build-android:
    needs: generate-version
    runs-on: ubuntu-latest
    if: contains(needs.generate-version.outputs.selected_platforms, 'android')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Setting up release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
            echo "Release keystore created"
          else
            echo "No keystore provided, will use debug signing"
          fi

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && 'release-key.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=${{ needs.generate-version.outputs.version_name }} \
            --build-number=${{ needs.generate-version.outputs.version_number }} \
            ${{ needs.generate-version.outputs.dart_defines }}

      - name: Build App Bundle
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && 'release-key.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.generate-version.outputs.version_name }} \
            --build-number=${{ needs.generate-version.outputs.version_number }} \
            ${{ needs.generate-version.outputs.dart_defines }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.generate-version.outputs.version_name }}
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ needs.generate-version.outputs.version_name }}
          path: build/app/outputs/bundle/release/*.aab

  # ==================== iOS ====================
  build-ios:
    needs: generate-version
    runs-on: macos-latest
    if: contains(needs.generate-version.outputs.selected_platforms, 'ios')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.generate-version.outputs.version_name }} \
            --build-number=${{ needs.generate-version.outputs.version_number }} \
            ${{ needs.generate-version.outputs.dart_defines }}

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.generate-version.outputs.version_name }}
          path: build/ios/iphoneos/

  # ==================== macOS ====================
  build-macos:
    needs: generate-version
    runs-on: macos-latest
    if: contains(needs.generate-version.outputs.selected_platforms, 'macos')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: |
          flutter build macos --release \
            --build-name=${{ needs.generate-version.outputs.version_name }} \
            --build-number=${{ needs.generate-version.outputs.version_number }} \
            ${{ needs.generate-version.outputs.dart_defines }}

      - name: Create ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r -9 obsidian-git-macos.zip obsidian_git.app

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ needs.generate-version.outputs.version_name }}
          path: build/macos/Build/Products/Release/obsidian-git-macos.zip

  # ==================== Linux ====================
  build-linux:
    needs: generate-version
    runs-on: ubuntu-latest
    if: contains(needs.generate-version.outputs.selected_platforms, 'linux')
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libssl-dev libpcre3 libgit2-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Fix libgit2 symlink for git2dart
        run: |
          # 查找 git2dart_binaries 包中的 libgit2.so 文件
          PUB_CACHE="${HOME}/.pub-cache"
          GIT2DART_BINARIES=$(find "$PUB_CACHE" -type d -name "git2dart_binaries*" | head -1)
          if [ -n "$GIT2DART_BINARIES" ]; then
            echo "Found git2dart_binaries at: $GIT2DART_BINARIES"
            ls -la "$GIT2DART_BINARIES/linux/" || true
            # 查找实际的 .so 文件
            ACTUAL_SO=$(find "$GIT2DART_BINARIES/linux" -name "libgit2*.so" | head -1)
            if [ -n "$ACTUAL_SO" ]; then
              echo "Found actual .so: $ACTUAL_SO"
              # 创建 CMake 期望的符号链接
              ln -sf "$ACTUAL_SO" "$GIT2DART_BINARIES/linux/libgit2-1.6.2.so"
              echo "Created symlink"
            else
              echo "No .so file found, checking pub.dev package..."
              # 检查包是否正确下载
              cat "$GIT2DART_BINARIES/pubspec.yaml" || true
            fi
          fi

      - name: Build Linux
        run: |
          flutter build linux --release \
            --build-name=${{ needs.generate-version.outputs.version_name }} \
            --build-number=${{ needs.generate-version.outputs.version_number }} \
            ${{ needs.generate-version.outputs.dart_defines }}

      - name: Create TAR
        run: |
          mkdir -p /tmp/linux-bundle
          cp -r build/linux/x64/release/bundle/* /tmp/linux-bundle/
          cd /tmp/linux-bundle
          tar czf $GITHUB_WORKSPACE/obsidian-git-linux-x64.tar.gz .

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-${{ needs.generate-version.outputs.version_name }}
          path: obsidian-git-linux-x64.tar.gz

  # ==================== Windows ====================
  build-windows:
    needs: generate-version
    runs-on: windows-latest
    if: contains(needs.generate-version.outputs.selected_platforms, 'windows')
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl -y
          # 查找 OpenSSL 安装位置
          Write-Host "Searching for OpenSSL DLLs..."
          Get-ChildItem -Path "C:\" -Filter "libcrypto*.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          Get-ChildItem -Path "C:\Program Files" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*crypto*" -or $_.Name -like "*ssl*" } | Select-Object FullName

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Fix libgit2 for git2dart on Windows
        shell: pwsh
        run: |
          # 查找 git2dart_binaries 包目录
          $pubCache = $env:LOCALAPPDATA + "\Pub\Cache"
          $git2dartBinaries = Get-ChildItem -Path $pubCache -Filter "git2dart_binaries*" -Directory -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if ($git2dartBinaries) {
            Write-Host "Found git2dart_binaries at: $($git2dartBinaries.FullName)"
            Get-ChildItem "$($git2dartBinaries.FullName)\windows\" | Format-Table Name, Length
            
            # 复制 libgit2.dll 到 libgit2-1.6.2.dll
            $libgit2Dll = Join-Path $git2dartBinaries.FullName "windows\libgit2.dll"
            $libgit2Target = Join-Path $git2dartBinaries.FullName "windows\libgit2-1.6.2.dll"
            if (Test-Path $libgit2Dll) {
              Copy-Item $libgit2Dll $libgit2Target -Force
              Write-Host "Created libgit2-1.6.2.dll"
            }
            
            # 搜索 libcrypto DLL
            $libcryptoTarget = Join-Path $git2dartBinaries.FullName "windows\libcrypto-1_1-x64.dll"
            
            # 可能的 OpenSSL DLL 位置
            $searchPaths = @(
              "C:\Program Files\OpenSSL-Win64\bin\libcrypto-1_1-x64.dll",
              "C:\Program Files\OpenSSL\bin\libcrypto-1_1-x64.dll",
              "C:\OpenSSL-Win64\bin\libcrypto-1_1-x64.dll",
              "C:\Program Files\OpenSSL-Win64\bin\libcrypto-3-x64.dll",
              "C:\Program Files\OpenSSL-Win64\bin\libcrypto.dll"
            )
            
            $found = $false
            foreach ($sslPath in $searchPaths) {
              if (Test-Path $sslPath) {
                Copy-Item $sslPath $libcryptoTarget -Force
                Write-Host "Copied libcrypto from: $sslPath"
                $found = $true
                break
              }
            }
            
            # 如果没找到，搜索整个 C 盘
            if (-not $found) {
              Write-Host "Searching for libcrypto DLLs..."
              $libcryptoDlls = Get-ChildItem -Path "C:\Program Files" -Filter "libcrypto*.dll" -Recurse -ErrorAction SilentlyContinue
              if ($libcryptoDlls) {
                $firstDll = $libcryptoDlls | Select-Object -First 1
                Copy-Item $firstDll.FullName $libcryptoTarget -Force
                Write-Host "Copied libcrypto from: $($firstDll.FullName)"
                $found = $true
              }
            }
            
            if (-not $found) {
              Write-Host "Warning: libcrypto-1_1-x64.dll not found"
            }
          }

      - name: Build Windows
        shell: bash
        run: |
          flutter build windows --release \
            --build-name=${{ needs.generate-version.outputs.version_name }} \
            --build-number=${{ needs.generate-version.outputs.version_number }} \
            ${{ needs.generate-version.outputs.dart_defines }}

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "obsidian-git-windows-x64.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ needs.generate-version.outputs.version_name }}
          path: obsidian-git-windows-x64.zip

  # ==================== Release Summary ====================
  build-summary:
    needs:
      - generate-version
      - build-android
      - build-ios
      - build-macos
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "========================================"
          echo "  Obsidian Git - Build Summary"
          echo "========================================"
          echo "  Version:       ${{ needs.generate-version.outputs.version_name }}"
          echo "  Build Number:  ${{ needs.generate-version.outputs.version_number }}"
          echo "  Build Type:    ${{ needs.generate-version.outputs.build_type }}"
          echo "  Tag:           ${{ needs.generate-version.outputs.build_tag || 'None (auto-generated)' }}"
          echo "  DateTime:      ${{ needs.generate-version.outputs.build_datetime || 'N/A' }}"
          echo "  Timezone:      ${{ needs.generate-version.outputs.build_timezone || 'N/A' }}"
          echo "  Commit:        ${{ github.sha }}"
          echo "  Branch:        ${{ github.ref_name }}"
          echo "========================================"
          echo ""
          echo "  Platform Builds:"
          echo "    Android:  ${{ needs.build-android.result }}"
          echo "    iOS:      ${{ needs.build-ios.result }}"
          echo "    macOS:    ${{ needs.build-macos.result }}"
          echo "    Linux:    ${{ needs.build-linux.result }}"
          echo "    Windows:  ${{ needs.build-windows.result }}"
          echo "========================================"
